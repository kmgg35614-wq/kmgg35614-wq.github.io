<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><title>여성건강간호학 | 질 건강 안내</title>
<style>
:root{--ink:#191719;--muted:#777078;--line:#ece7ea;--pink:#ed4c8a;--pale:#f9eaf0;--mauve:#e9dfe4}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f7f6f7;color:var(--ink);font-family:"Noto Sans KR",Apple SD Gothic Neo,Arial,sans-serif;font-size:14px;line-height:1.7}
.site{width:min(100%,430px);margin:0 auto;min-height:100vh;background:#fff;box-shadow:0 0 28px #0000000b}
.top{position:sticky;top:0;z-index:20;background:#ffffffed;backdrop-filter:blur(10px)}
.head{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;border-bottom:1px solid var(--line)}
.head button{border:0;background:transparent;font-size:23px;padding:5px 8px;cursor:pointer;color:#222}.head b{font-size:18px;letter-spacing:-.7px}
.tabs{display:flex;overflow-x:auto;white-space:nowrap;border-bottom:1px solid #e7e3e5;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:0;background:#fff;padding:12px 11px 10px;font-size:12px;color:#454047;border-bottom:2px solid transparent;cursor:pointer}.tabs button.active{border-color:#222;color:#111;font-weight:800}
.content{padding:19px 16px 28px;min-height:75vh}
.menuitems{display:none;}
.menuitems.show{display:flex;flex-wrap:nowrap;align-items:center;gap:7px;overflow-x:auto;overflow-y:hidden;white-space:nowrap;padding:10px 12px;background:#050505;border-bottom:1px solid #252525;scrollbar-width:thin;transform-origin:left center;animation:menuExpand .28s ease-out both;-webkit-overflow-scrolling:touch}
.menuitems a{flex:0 0 auto;display:block;padding:8px 12px;color:#fff;text-decoration:none;font-size:13px;font-weight:600;border:1px solid #444;border-radius:7px;background:#111}
.menuitems a:active,.menuitems a:focus-visible{background:#fff;color:#050505;outline:none}
@keyframes menuExpand{from{opacity:0;transform:scaleX(.05)}to{opacity:1;transform:scaleX(1)}}
.searchbox{display:none;padding:10px 15px}.searchbox.show{display:block}.searchbox input{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px;font:inherit}
.heroimg{width:100%;margin:12px auto 7px;text-align:center}.heroimg img{width:100%;height:auto;max-height:430px;object-fit:contain;display:block}
.intro{text-align:center;font-size:13px;line-height:1.8;padding:0 3px}.intro h1{font-size:25px;margin:5px 0 4px;letter-spacing:-1px}.lead{text-align:center;font-size:16px;font-weight:800;line-height:1.6;margin:36px 0 15px}
.sub{color:var(--muted);font-size:12px}.panel-title{background:var(--mauve);border-radius:13px;padding:18px 14px;text-align:center;margin:4px 0 18px}.panel-title h2{font-size:19px;margin:0}.panel-title p{margin:4px 0 0;color:#777;font-size:12px}
.checkrow{display:flex;align-items:flex-start;gap:11px;padding:13px 11px;border:1px solid #e4dfe2;border-radius:8px;margin:8px 0;cursor:pointer;line-height:1.55}.checkrow input{width:18px;height:18px;accent-color:#222;flex:none;margin-top:2px}
.result{background:#f5f3f4;border:1px solid #e4dfe2;border-radius:8px;padding:14px;margin:18px 0}.result strong{display:block;font-size:15px;margin:4px 0}
.banner{margin:23px 0 0}.banner img{display:block;width:100%;height:auto;border-radius:2px}.copyright{text-align:center;color:#89838a;font-size:10px;margin:14px 0 0}
.article h2{font-size:23px;line-height:1.4;margin:3px 0 10px;letter-spacing:-.7px}.article h3{font-size:17px;margin:0 0 8px}.article p{margin:8px 0;color:#4d484d}.section{margin:19px 0 25px}.section h2{margin-bottom:9px}
.photo{width:100%;height:175px;object-fit:cover;border-radius:15px;margin:15px 0}
.gallery{display:flex;gap:12px;overflow-x:auto;padding:8px 0 14px;scroll-snap-type:x mandatory}.gallery figure{margin:0;flex:0 0 78%;height:380px;position:relative;scroll-snap-align:center;border-radius:15px;overflow:hidden;background:#eee}.gallery img{width:100%;height:100%;object-fit:cover}.gallery figcaption{position:absolute;bottom:0;left:0;right:0;padding:30px 15px 13px;color:#fff;font-weight:700;background:linear-gradient(transparent,#0009)}
.accordion{border:1px solid #e1dce0;border-radius:15px;margin:11px 0;overflow:hidden}.accordion summary{list-style:none;padding:15px 15px;font-weight:800;display:flex;align-items:center;gap:10px;cursor:pointer}.accordion summary::-webkit-details-marker{display:none}.accordion summary:after{content:"＋";margin-left:auto;font-size:21px;font-weight:400}.accordion[open] summary:after{content:"−"}.accordion .body{padding:0 16px 17px;color:#555}.accordion .body p{margin:7px 0}
.quizitem{border-bottom:1px solid #e8e3e6;padding:15px 3px}.quizitem>p{font-weight:700;color:#171417}.ox{display:flex;gap:9px}.ox button{width:70px;padding:8px;border:1px solid #ddd;border-radius:7px;background:#fff;font-size:17px;cursor:pointer}.ox button.sel{background:#171417;color:white}.ox button:disabled{opacity:.85}.feedback{background:#f3f1f2;border-radius:8px;padding:13px;margin-top:12px}.last{text-align:center;padding:30px 12px}.heart{font-size:31px;color:#ed4b91}.lastbox{border:1px solid #e2dce0;border-radius:12px;padding:19px;margin:16px 0}.small{font-size:11px;color:#89838a}.btn{border:0;border-radius:7px;padding:10px 16px;background:#191719;color:white;cursor:pointer}
@media(min-width:600px){body{padding:22px 0}.site{border-radius:14px;overflow:hidden}}

.type-photo{width:100%;height:auto;max-height:300px;object-fit:contain;border-radius:0;display:block;margin:0 auto 14px;background:transparent}
.type-heading{display:flex;align-items:center;gap:9px;margin:0 0 8px}
.type-number{display:inline; color:#555; font-size:inherit; font-weight:700; flex:none}
.type-section{padding:20px 0 24px;border-bottom:1px solid #eee7eb}
.type-section p{margin:7px 0;color:#444;line-height:1.75}
.type-tabs{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 18px}
.type-tabs button{border:1px solid #dedede;background:#fff;color:#333;border-radius:7px;padding:9px 11px;font:inherit;font-size:13px;cursor:pointer}
.type-tabs button.active{background:#222;color:#fff;border-color:#222}
.type-section{display:none}
.type-section.active{display:block}

.last{ text-align:center; padding:30px 12px 18px; }
.last .vcare-card{background:#050505;color:#fff;border-radius:0;padding:42px 24px;margin:0 auto 42px;max-width:560px;min-height:330px;display:flex;flex-direction:column;justify-content:center;box-sizing:border-box}
.last .vcare-card h2{font-size:34px;letter-spacing:1px;margin:0 0 34px;color:#fff}
.last .vcare-card p{font-size:14px;line-height:1.9;margin:0 0 22px;color:#f7f3f5}
.last .vcare-card p:last-child{margin-bottom:0}
.last .counsel-section{padding:4px 4px 22px;margin:0 auto;max-width:560px}
.last .counsel-section h3{font-size:25px;margin:0 0 24px;color:#211d20}
.last .counsel-section p{font-size:14px;line-height:1.9;color:#777078;margin:0 0 24px}
.last .call129{background:#050505;color:#fff;border-radius:15px;padding:24px 16px;margin:0 auto 28px;max-width:100%;font-size:14px;line-height:1.8}
.last .call129 strong{display:block;font-size:25px;letter-spacing:1px;margin-top:3px;color:#fff}
.last .small{font-size:11px;color:#89838a}

.notice{background:#fff7fa;border-left:4px solid #c65a86;padding:12px 14px;border-radius:8px;line-height:1.7}
.closing-message{margin-top:16px;padding:16px;background:#fff7fa;border-radius:12px;line-height:1.8}
.article .body ul{padding-left:22px;line-height:1.85}
.article .body li{margin:4px 0}

.home-title{cursor:pointer;user-select:none}
.home-title:focus-visible{outline:2px solid #c65a86;outline-offset:4px;border-radius:4px}

.home-type-gallery{margin:25px -16px 8px;padding:0 16px}
.home-type-gallery h2{font-size:18px;letter-spacing:-.5px;margin:0 0 11px}
.home-type-scroll{display:flex;gap:11px;overflow-x:auto;overflow-y:hidden;padding:2px 1px 10px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.home-type-thumb{flex:0 0 116px;width:116px;padding:0 0 7px;border:0;border-radius:12px;overflow:hidden;background:#fff;cursor:pointer;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:7px;color:#292329;font:inherit}
.home-type-thumb img{display:block;width:116px;height:116px;object-fit:cover;border-radius:12px;background:#f3f0f2}
.home-type-thumb span{display:block;width:100%;font-size:12px;font-weight:700;line-height:1.45;text-align:center;white-space:normal}
.home-type-thumb:focus-visible{outline:3px solid #c65a86;outline-offset:3px}
.last{padding-left:0;padding-right:0}
.last .vcare-card{width:100%;max-width:none;margin:0 0 42px;border-radius:0;box-sizing:border-box}
.last .counsel-section{padding-left:12px;padding-right:12px}

function home(){return `<div class="heroimg"><img src="${hero}" alt="질염 증상과 여성 생식기관 안내 일러스트"></div><div class="intro"><h1>질염 (Vaginitis)</h1>질염은 여성의 생식기관인 질이 세균, 바이러스, 곰팡이, 기생충 등에 감염되어 염증이 발생한 상태를 의미합니다.</div><section class="home-type-gallery" aria-label="질염의 종류 바로가기"><h2>질염의 종류</h2><div class="home-type-scroll">${typeThumbs.map((src,i)=>`<button class="home-type-thumb" type="button" aria-label="${["세균성 질염","트리코모나스 질염","칸디다 질염","염증성 질염","위축성 질염"][i]} 보기" onclick="go('types');showType(${i})"><img src="${src}" alt=""><span>${["세균성 질염","트리코모나스 질염","칸디다 질염","염증성 질염","위축성 질염"][i]}</span></button>`).join('')}</div></section>${banner()}`}
function self(){return `<div class="sub">나에게 해당하는 항목을 선택하면 아래에서 결과를 바로 확인할 수 있어요.</div><div id="checks">${checklist.map(x=>`<label class="checkrow"><input type="checkbox" onchange="updateCheck()"><span>${x}</span></label>`).join('')}</div><div class="result" id="checkresult"><span class="sub">선택한 항목 0개</span><strong>해당사항 없음</strong>불편한 증상이 없더라도 평소와 다른 변화가 있다면 몸 상태를 살펴보세요.</div><div class="small">1개 이상 선택하면 증상에 대한 안내가 표시됩니다. 이 결과는 진단이 아니며, 증상이 지속되거나 반복될 경우 진료를 받아보세요.</div>${banner()}`}
function updateCheck(){let n=document.querySelectorAll('#checks input:checked').length;let r=document.getElementById('checkresult');r.innerHTML=`<span class="sub">선택한 항목 ${n}개</span><strong>${n?'질염뿐 아니라 다른 원인에 의한 증상일 수도 있으므로 증상이 지속되거나 반복될 경우 산부인과 진료를 받아보세요':'해당사항 없음'}</strong>${n?'선택한 항목만으로 질염을 판단할 수 없습니다. 정확한 원인 확인을 위해 의료진과 상담하세요.':'현재 선택한 항목이 없습니다. 평소와 다른 변화가 생기면 다시 확인해 보세요.'}`}

<p><b>정의 및 원인:</b> 질 내 환경의 변화로 정상적으로 존재하는 락토바실리 유산균이 감소하거나 소실되고 혐기성 세균이 증식하면서 발생하는 질 내 감염증이다. 잦은 질 내부 세척이나 성관계 등으로 질 내 환경이 변화하는 것이 관련 요인으로 추정된다.</p>
<p><b>주요 증상:</b> 누런색 또는 회색의 질 분비물, 생선 냄새와 같은 악취가 나타날 수 있으며 생리 전후나 성관계 후 증상이 심해질 수 있다. 증상이 없는 경우도 있다.</p>
<p><b>진단 및 검사:</b> 질 분비물 검사, 질 내 pH 측정, 현미경 검사 등을 통해 확인하며 단서 세포(clue cell)가 관찰될 수 있다.</p>
<p><b>치료:</b> 메트로니다졸이나 클린다마이신 등의 항생제를 사용한다. 정확한 약물과 치료 방법은 의료진이 결정한다.</p>
<p><b>주의사항:</b> 재발할 수 있으므로 증상이 반복되면 다시 진료를 받아야 한다.</p></section>

<p><b>정의 및 원인:</b> 트리코모나스 원충에 의해 발생하는 질 내 감염증으로 주로 성접촉을 통해 전파된다. 전염성이 있으며 남성은 감염되어도 증상이 없는 경우가 많다.</p>
<p><b>주요 증상:</b> 심한 악취가 나는 고름 같은 질 분비물, 외음부 가려움증, 화끈거림 등이 나타날 수 있다. 기포가 섞인 분비물이 나타나기도 한다.</p>
<p><b>진단 및 검사:</b> 질 분비물 현미경 검사나 핵산증폭검사 등을 통해 확인한다. 움직이는 트리코모나스 원충이 관찰될 수 있다.</p>
<p><b>치료:</b> 메트로니다졸 등의 항원충 효과가 있는 약물을 사용한다. 성 파트너도 검사와 치료를 받아야 하며 재감염 예방을 위해 치료를 함께 진행하는 것이 중요하다.</p>

<p><b>정의 및 원인:</b> 칸디다균에 의해 발생하는 질염으로, 가장 흔한 원인균은 칸디다 알비칸스(Candida albicans)이다. 당뇨병, 항생제 사용, 임신, 면역력 저하 등이 발생 위험을 높일 수 있다. 성매개감염은 아니다.</p>
<p><b>주요 증상:</b> 흰색 치즈 조각과 같은 질 분비물, 외음부 가려움증, 작열감 등이 나타나며 외음부의 발적과 부종, 배뇨통 및 성교통이 동반될 수 있다.</p>
<p><b>진단 및 검사:</b> 질 분비물 검사, KOH 도말검사 및 필요시 배양검사를 통해 확인한다.</p>
<p><b>치료:</b> 아졸 계열의 항진균제를 사용하며 질정, 크림 또는 경구약 등의 방법이 있다.</p>

<p><b>정의 및 원인:</b> 화농성 질 분비물이 증가하고 질 상피세포가 탈락하는 질염이다. 정확한 발생 원인이나 원인균은 아직 명확하게 밝혀지지 않았다.</p>
<p><b>주요 증상:</b> 심한 화농성 질 분비물, 질 및 외음부 가려움증, 작열감, 자극감과 성교통 등이 나타날 수 있다.</p>
<p><b>진단 및 검사:</b> 임상 증상과 진찰을 바탕으로 진단하며 질벽의 발적과 염증 소견 등을 확인한다. 다른 종류의 질염과 구별하는 것이 중요하다.</p>
<p><b>치료:</b> 클린다마이신 등의 국소 치료제를 사용하며 필요에 따라 호르몬 치료를 고려하기도 한다.</p>
<p><b>주의사항:</b> 치료 후에도 재발할 수 있으므로 증상이 지속되거나 반복되면 진료를 받아야 한다.</p></section>

<p><b>정의 및 원인:</b> 폐경으로 여성호르몬인 에스트로겐이 감소하면서 질 점막이 얇아지고 위축되어 발생하는 질염이다.</p>
<p><b>주요 증상:</b> 질 건조감, 화농성 질 분비물, 성관계 시 통증 및 성교 후 출혈 등이 나타날 수 있다.</p>
<p><b>진단 및 검사:</b> 폐경 여부와 증상을 확인하고 질 점막의 위축 상태 및 질 분비물 검사 등을 통해 진단한다.</p>
<p><b>치료:</b> 부족한 여성호르몬을 보충하기 위해 국소 에스트로겐 연고나 질정 등을 사용할 수 있다.</p>
<p><b>주의사항:</b> 폐경 이후 질 건조감이나 출혈이 나타난다면 단순한 노화 현상으로 생각하지 말고 의료기관에서 원인을 확인해야 한다.</p></section>

['4. 산부인과 방문에 대한 인식 개선',`<p>산부인과는 임신과 출산을 위해서만 방문하는 곳이 아니다. 여성의 생식기 건강과 관련된 다양한 질환을 진단하고 치료하는 의료기관이다.</p><p>질염이나 생리불순, 생식기 통증 등 여성 건강에 이상이 발생했을 때 부담 없이 방문하여 진료를 받을 수 있어야 한다.</p><p class="closing-message"><b>질염을 부끄러워하거나 숨기지 마세요.</b><br>정확한 진단과 적절한 치료가 건강을 지키는 첫걸음입니다.</p>`]
